spring.application.name=lab15

# Part B.c: replace HOST, PORT, DATABASE and the password with YOUR Aiven connection details
spring.datasource.url=jdbc:mysql://HOST:PORT/DATABASE?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=YOUR_AIVEN_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL is not an embedded database: run schema.sql and data.sql at every start
spring.sql.init.mode=always

spring.mvc.problemdetails.enabled=true
