# Step 4d/4e: log4j configuration
# Root logger: minimum level = INFO, using appender named LOG1
log4j.rootLogger = INFO, LOG1

# Step 4d: Configure LOG1 to log to a file (FileAppender)
log4j.appender.LOG1=org.apache.log4j.FileAppender

# Step 4d: Output file path
log = ./logs/App/log4j
log4j.appender.LOG1.File=${log}/log.out

# Step 4d: Create the file if it does not exist (append by default)
log4j.appender.LOG1.Append=true

# Step 4d: Log format
# %d: timestamp  %p: priority  %t: thread  %C: class  %m: message  %n: newline
log4j.appender.LOG1.layout=org.apache.log4j.PatternLayout
log4j.appender.LOG1.layout.conversionPattern=%d %p [%t] %C - %m%n
