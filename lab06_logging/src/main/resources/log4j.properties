# Step 4d/4e: log4j configuration
# Root logger: minimum level = INFO, using two appenders: file (LOG1) and console (CONSOLE)
# AI recommendation #5: add a ConsoleAppender fallback so logs are always visible
log4j.rootLogger = INFO, LOG1, CONSOLE

# ── File Appender (LOG1) ─────────────────────────────────────────────────────
log4j.appender.LOG1=org.apache.log4j.FileAppender

# Output file path (the ./logs/App/log4j directory must exist before running)
log = ./logs/App/log4j
log4j.appender.LOG1.File=${log}/log.out

# Append to existing file (set to false to overwrite each run)
log4j.appender.LOG1.Append=true

# Log format:
# %d: timestamp  %p: priority  %t: thread  %C: class  %m: message  %n: newline
log4j.appender.LOG1.layout=org.apache.log4j.PatternLayout
log4j.appender.LOG1.layout.conversionPattern=%d %p [%t] %C - %m%n

# ── Console Appender (CONSOLE) ───────────────────────────────────────────────
# AI recommendation: fallback so logs appear in the terminal even if the file path fails
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.conversionPattern=%d{HH:mm:ss} %-5p [%C{1}] - %m%n
